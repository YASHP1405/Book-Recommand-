<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ book.title if book else "Book Not Found" }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: #fff;
                 border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,.1); }
    h1 { color: #4f46e5; }
    .book-meta { color: #6b7280; margin-bottom: 1rem; }
    .book-genres span { background: #e0e7ff; color: #4f46e5; padding: .3rem .8rem;
                        border-radius: 20px; font-size: .9rem; margin-right: .5rem; }
    .price { font-size: 1.2rem; color: #059669; font-weight: bold; margin: 1rem 0; }
    .platforms { margin: .5rem 0; }
    .back { display: inline-block; margin-top: 2rem; text-decoration: none;
            padding: .6rem 1.2rem; background: #4f46e5; color: #fff; border-radius: 6px; }
    .back:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="container">
    {% if book %}
      <h1>{{ book.title }}</h1>
      <p class="book-meta">by {{ book.author }}</p>

      <div class="book-genres">
        {% for genre in book.genre.split(',') %}
          <span>{{ genre.strip() }}</span>
        {% endfor %}
      </div>

      <p>{{ book.summary }}</p>
      <p class="price">Price: ₹{{ book.price }}</p>
      <p class="platforms"><strong>Available at:</strong> {{ book.platform }}</p>
    {% else %}
      <p>❌ Book not found.</p>
    {% endif %}

    <a href="{{ url_for('recommend') }}" class="back"><i class="fas fa-arrow-left"></i> Back to Recommendations</a>
  </div>
</body>
</html>
